packages:
  - packages/*
  - packages/*/test-app
  - playgrounds/*
  - tests/app

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - lmdb
  - msgpackr-extract

overrides:
  cookie: '>=0.7.0'
  '@tailwindcss/typography>postcss-selector-parser': '^7.1.6'

auditConfig:
  ignoreGhsas:
    # braces: disputed upstream with no fix planned, only reachable through dev tooling (es-check, nodemon)
    - GHSA-vfj7-8cjw-p6xm
